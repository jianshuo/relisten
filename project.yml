name: Relisten
options:
  bundleIdPrefix: com.wangjianshuo
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Relisten:
    type: application
    platform: macOS
    sources: [Relisten]
    info:
      path: Relisten/Info.plist
      properties:
        CFBundleDisplayName: Relisten
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleName: Relisten
        LSApplicationCategoryType: public.app-category.education
        NSHumanReadableCopyright: "© 2026 王建硕"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Media
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audio, public.audiovisual-content]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangjianshuo.relisten
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_ENTITLEMENTS: Relisten/Relisten.entitlements
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Embed LGPL ffmpeg helpers
        script: "\"$PROJECT_DIR/scripts/embed-ffmpeg.sh\""
        basedOnDependencyAnalysis: false
  RelistenTests:
    type: bundle.unit-test
    platform: macOS
    sources: [RelistenTests]
    dependencies:
      - target: Relisten
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
